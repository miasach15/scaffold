<!--
  Paste this into: Supabase Dashboard → Authentication → Emails → "Confirm signup"
  Keep the {{ .ConfirmationURL }} tag as-is — Supabase fills it in automatically.
-->
<div style="font-family: -apple-system, 'Inter', sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; background: #FAFAFA;">
  <div style="font-family: Georgia, 'Playfair Display', serif; font-size: 26px; font-weight: 700; color: #000000; margin-bottom: 6px;">Scaffold</div>
  <p style="font-size: 14px; color: #5A6472; margin-top: 0; line-height: 1.5;">Confirm your email to get started.</p>
  <a href="{{ .ConfirmationURL }}" style="display: inline-block; margin-top: 20px; padding: 12px 24px; background: linear-gradient(135deg, #7B6EF0, #5849C4); color: #ffffff; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 14px;">Confirm my email</a>
  <p style="font-size: 12px; color: #9CA3AF; margin-top: 32px; line-height: 1.5;">If you didn't sign up for Scaffold, you can safely ignore this email.</p>
</div>
